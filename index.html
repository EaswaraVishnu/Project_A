<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Chat Mimic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #000;
    --surface: #1a1a1a;
    --surface2: #262626;
    --border: #363636;
    --text: #fafafa;
    --text-muted: #a8a8a8;
    --accent: #0095f6;
    --accent2: #833ab4;
    --bubble-them: #262626;
    --bubble-me: #0095f6;
    --radius: 22px;
    --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    height: 100dvh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
  }

  #setup-screen, #contact-screen {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    gap: 1.5rem;
  }

  .logo {
    width: 56px; height: 56px;
    background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }

  h1 { font-size: 22px; font-weight: 600; text-align: center; }
  p.sub { font-size: 14px; color: var(--text-muted); text-align: center; line-height: 1.5; }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.25rem;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .card label { font-size: 13px; color: var(--text-muted); font-weight: 500; }

  input[type="text"], input[type="password"], input[type="file"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 12px 14px;
    width: 100%;
    outline: none;
    font-family: var(--font);
  }
  input:focus { border-color: var(--accent); }
  input[type="file"] { padding: 10px; font-size: 13px; cursor: pointer; }

  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
    font-family: var(--font);
  }
  .btn:active { opacity: 0.85; }

  .hint { font-size: 12px; color: var(--text-muted); text-align: center; line-height: 1.6; }
  .hint a { color: var(--accent); text-decoration: none; }

  #contact-screen { justify-content: flex-start; padding-top: 1.5rem; }
  .contact-list { width: 100%; display: flex; flex-direction: column; gap: 2px; }
  .contact-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-radius: 12px;
    cursor: pointer;
    transition: background 0.15s;
  }
  .contact-item:active { background: var(--surface); }
  .avatar {
    width: 48px; height: 48px; border-radius: 50%;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 600; color: #fff; flex-shrink: 0;
  }
  .contact-info { flex: 1; min-width: 0; }
  .contact-name { font-size: 15px; font-weight: 500; }
  .contact-preview { font-size: 13px; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .msg-count { font-size: 12px; color: var(--text-muted); background: var(--surface2); padding: 3px 8px; border-radius: 20px; flex-shrink: 0; }

  .search-box {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 14px;
    outline: none;
    font-family: var(--font);
  }

  #chat-screen {
    flex: 1;
    display: none;
    flex-direction: column;
  }

  .chat-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }
  .back-btn {
    background: none; border: none; color: var(--accent);
    font-size: 22px; cursor: pointer; padding: 0 8px 0 0;
    font-family: var(--font); line-height: 1;
  }
  .chat-header .avatar { width: 38px; height: 38px; font-size: 15px; }
  .chat-header-info { flex: 1; }
  .chat-header-name { font-size: 15px; font-weight: 600; }
  .chat-header-sub { font-size: 12px; color: var(--text-muted); }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .bubble-wrap { display: flex; flex-direction: column; margin: 2px 0; }
  .bubble-wrap.me { align-items: flex-end; }
  .bubble-wrap.them { align-items: flex-start; }

  .bubble {
    max-width: 75%;
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 15px;
    line-height: 1.45;
    word-break: break-word;
  }
  .bubble.me { background: var(--bubble-me); color: #fff; border-bottom-right-radius: 5px; }
  .bubble.them { background: var(--bubble-them); color: var(--text); border-bottom-left-radius: 5px; border: 1px solid var(--border); }
  .bubble.typing { color: var(--text-muted); font-style: italic; }

  .input-area {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    align-items: flex-end;
    gap: 10px;
    background: var(--bg);
  }
  #msg-input {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 22px;
    color: var(--text);
    font-size: 15px;
    padding: 10px 16px;
    outline: none;
    resize: none;
    max-height: 120px;
    font-family: var(--font);
    line-height: 1.4;
  }
  .send-btn {
    background: var(--accent);
    border: none;
    border-radius: 50%;
    width: 38px; height: 38px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; flex-shrink: 0;
  }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .send-btn svg { width: 18px; height: 18px; fill: #fff; }

  .hidden { display: none !important; }
  #error-msg { color: #ff3b30; font-size: 13px; text-align: center; }

  #messages::-webkit-scrollbar { width: 3px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .divider { font-size: 11px; color: var(--text-muted); text-align: center; margin: 10px 0 6px; }
</style>
</head>
<body>

<!-- SETUP SCREEN -->
<div id="setup-screen">
  <div class="logo">📱</div>
  <h1>Instagram Chat Mimic</h1>
  <p class="sub">Powered by Groq — 100% free, private & fast</p>

  <div class="card">
    <label>Groq API Key</label>
    <input type="password" id="api-key-input" placeholder="gsk_..." autocomplete="off" />

    <label>Instagram JSON Export File</label>
    <input type="file" id="json-file" accept=".json" />

    <p id="error-msg" class="hidden"></p>
    <button class="btn" onclick="loadData()">Continue →</button>
  </div>

  <p class="hint">
    Free API key at <a href="https://console.groq.com" target="_blank">console.groq.com</a> — no card needed<br>
    Your JSON file never leaves your device
  </p>
</div>

<!-- CONTACT SCREEN -->
<div id="contact-screen" class="hidden">
  <h1 style="align-self:flex-start; padding: 0 4px 8px;">Messages</h1>
  <input class="search-box" id="search-input" placeholder="Search contacts..." oninput="filterContacts()" />
  <br>
  <div class="contact-list" id="contact-list"></div>
</div>

<!-- CHAT SCREEN -->
<div id="chat-screen">
  <div class="chat-header">
    <button class="back-btn" onclick="goBack()">‹</button>
    <div class="avatar" id="chat-avatar"></div>
    <div class="chat-header-info">
      <div class="chat-header-name" id="chat-name"></div>
      <div class="chat-header-sub">AI mimic · free via Groq</div>
    </div>
  </div>

  <div id="messages"></div>

  <div class="input-area">
    <textarea id="msg-input" placeholder="Message..." rows="1" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
let apiKey = '';
let allContacts = {};
let currentContact = null;
let chatHistory = [];
let systemPrompt = '';

function showError(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.remove('hidden');
}

function loadData() {
  const key = document.getElementById('api-key-input').value.trim();
  const file = document.getElementById('json-file').files[0];
  if (!key) return showError('Please enter your Groq API key.');
  if (!file) return showError('Please select your Instagram JSON file.');
  apiKey = key;
  localStorage.setItem('ig_groq_key', key);
  const reader = new FileReader();
  reader.onload = e => {
    try {
      parseInstagramData(JSON.parse(e.target.result));
    } catch {
      showError('Invalid JSON file. Please upload a valid Instagram export.');
    }
  };
  reader.readAsText(file);
}

function parseInstagramData(data) {
  let conversations = [];
  if (data.messages && Array.isArray(data.messages)) {
    conversations = [data];
  } else if (Array.isArray(data)) {
    conversations = data;
  } else {
    for (const k of Object.keys(data)) {
      if (Array.isArray(data[k]) && data[k][0]?.messages) {
        conversations = data[k]; break;
      }
    }
  }
  if (!conversations.length) return showError('No messages found. Try uploading a specific conversation file like message_1.json');

  allContacts = {};
  for (const convo of conversations) {
    const messages = convo.messages || [];
    if (!messages.length) continue;
    const senderCounts = {};
    for (const m of messages) {
      if (m.sender_name) senderCounts[m.sender_name] = (senderCounts[m.sender_name] || 0) + 1;
    }
    for (const name of Object.keys(senderCounts)) {
      if (!allContacts[name]) allContacts[name] = { name, messages: [], theirMessages: [] };
      for (const m of messages) {
        if (!m.content) continue;
        allContacts[name].messages.push(m);
        if (m.sender_name === name) allContacts[name].theirMessages.push(m.content);
      }
    }
  }

  for (const k of Object.keys(allContacts)) {
    if (allContacts[k].theirMessages.length < 3) delete allContacts[k];
  }

  if (!Object.keys(allContacts).length) return showError('No valid contacts found in this file.');

  localStorage.setItem('ig_contacts_meta', JSON.stringify(
    Object.fromEntries(Object.entries(allContacts).map(([k,v]) => [k, { name: v.name, count: v.theirMessages.length, preview: v.theirMessages.slice(-1)[0] || '' }]))
  ));

  showContactScreen();
}

function showContactScreen() {
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('contact-screen').classList.remove('hidden');
  renderContacts(Object.values(allContacts));
}

function renderContacts(contacts) {
  const list = document.getElementById('contact-list');
  list.innerHTML = '';
  contacts.sort((a, b) => b.theirMessages.length - a.theirMessages.length);
  for (const c of contacts) {
    const preview = c.theirMessages[c.theirMessages.length - 1] || '';
    const div = document.createElement('div');
    div.className = 'contact-item';
    div.innerHTML = `
      <div class="avatar">${c.name[0].toUpperCase()}</div>
      <div class="contact-info">
        <div class="contact-name">${escHtml(c.name)}</div>
        <div class="contact-preview">${escHtml(preview.slice(0, 60))}</div>
      </div>
      <div class="msg-count">${c.theirMessages.length} msgs</div>
    `;
    div.onclick = () => openChat(c.name);
    list.appendChild(div);
  }
}

function filterContacts() {
  const q = document.getElementById('search-input').value.toLowerCase();
  renderContacts(Object.values(allContacts).filter(c => c.name.toLowerCase().includes(q)));
}

function openChat(name) {
  currentContact = allContacts[name];
  chatHistory = [];

  const sample = currentContact.theirMessages.slice(-300).join('\n');
  systemPrompt = `You are roleplaying as "${name}" in an Instagram DM chat.

Below are real messages that ${name} has sent. Study them carefully to learn their exact texting style:

---
${sample}
---

Important rules:
- Mimic their spelling, grammar, punctuation and capitalization exactly
- Copy their use of slang, abbreviations, emoji
- Match their message length (short = short, long = long)
- Use their recurring phrases and expressions
- Stay in character at all times — you ARE ${name}
- Never say you are an AI
- Respond naturally like a real DM conversation`;

  document.getElementById('contact-screen').classList.add('hidden');
  const cs = document.getElementById('chat-screen');
  cs.style.display = 'flex';
  document.getElementById('chat-name').textContent = name;
  document.getElementById('chat-avatar').textContent = name[0].toUpperCase();

  const msgs = document.getElementById('messages');
  msgs.innerHTML = '';

  // Show last few real messages as conversation history preview
  const recent = currentContact.messages.slice(-8);
  if (recent.length) {
    const d = document.createElement('div');
    d.className = 'divider';
    d.textContent = '— previous messages —';
    msgs.appendChild(d);
    for (const m of recent) {
      if (!m.content) continue;
      appendBubble(m.content, m.sender_name === name ? 'them' : 'me', false);
    }
    const d2 = document.createElement('div');
    d2.className = 'divider';
    d2.textContent = '— AI chat starts below —';
    msgs.appendChild(d2);
  }

  msgs.scrollTop = msgs.scrollHeight;
  document.getElementById('msg-input').focus();
}

function goBack() {
  document.getElementById('chat-screen').style.display = 'none';
  document.getElementById('contact-screen').classList.remove('hidden');
  currentContact = null;
  chatHistory = [];
}

async function sendMessage() {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentContact) return;

  input.value = '';
  input.style.height = 'auto';
  appendBubble(text, 'me');
  chatHistory.push({ role: 'user', content: text });

  const btn = document.getElementById('send-btn');
  btn.disabled = true;
  const typingEl = appendBubble('typing…', 'them typing');

  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: 'llama-3.1-8b-instant',
        max_tokens: 300,
        messages: [
          { role: 'system', content: systemPrompt },
          ...chatHistory
        ]
      })
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.choices?.[0]?.message?.content || '…';
    typingEl.remove();
    appendBubble(reply, 'them');
    chatHistory.push({ role: 'assistant', content: reply });
  } catch (err) {
    typingEl.querySelector?.('.bubble') ? typingEl.querySelector('.bubble').textContent = 'Error: ' + err.message : typingEl.textContent = 'Error: ' + err.message;
    typingEl.classList?.remove('typing');
  }

  btn.disabled = false;
}

function appendBubble(text, side, scroll = true) {
  const msgs = document.getElementById('messages');
  const wrap = document.createElement('div');
  wrap.className = `bubble-wrap ${side === 'me' ? 'me' : 'them'}`;
  const bubble = document.createElement('div');
  bubble.className = `bubble ${side}`;
  bubble.textContent = text;
  wrap.appendChild(bubble);
  msgs.appendChild(wrap);
  if (scroll) msgs.scrollTop = msgs.scrollHeight;
  return bubble;
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

document.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem('ig_groq_key');
  if (saved) document.getElementById('api-key-input').value = saved;
  document.getElementById('msg-input')?.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
});
</script>
</body>
</html>
